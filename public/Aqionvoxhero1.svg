<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Ring gradient: Light Blue to Soft Purple -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   style="stop-color:#88CCFF;stop-opacity:1"/>
      <stop offset="35%"  style="stop-color:#55AAFF;stop-opacity:1"/>
      <stop offset="65%"  style="stop-color:#9966FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#CC88FF;stop-opacity:1"/>
    </linearGradient>

    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   style="stop-color:#AADDFF;stop-opacity:1"/>
      <stop offset="50%"  style="stop-color:#7755FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#44BBFF;stop-opacity:1"/>
    </linearGradient>

    <!-- Outer glow filter -->
    <filter id="ringGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="5"  in="SourceGraphic" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Far halo blur -->
    <filter id="haloGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="28" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="halo"/>
      </feMerge>
    </filter>

    <!-- Dot glow -->
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="dblur"/>
      <feMerge>
        <feMergeNode in="dblur"/>
        <feMergeNode in="dblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#F8F5EE"/>

  <!-- Atmospheric background halo — purely static colour bloom -->
  <circle cx="400" cy="400" r="248" fill="none" stroke="#9966FF"
          stroke-width="90" opacity="0.055" filter="url(#haloGlow)"/>
  <circle cx="400" cy="400" r="248" fill="none" stroke="#55AAFF"
          stroke-width="50" opacity="0.04"  filter="url(#haloGlow)"/>

  <!-- ============================================================
       STATIONARY GRADIENT RING
       The ring itself never rotates.
       ============================================================ -->

  <!-- Outermost soft halo of the ring -->
  <circle cx="400" cy="400" r="235"
          fill="none" stroke="url(#ringGrad1)"
          stroke-width="26" opacity="0.22"
          filter="url(#haloGlow)"/>

  <!-- Main crisp glowing ring -->
  <circle cx="400" cy="400" r="235"
          fill="none" stroke="url(#ringGrad1)"
          stroke-width="7" stroke-linecap="round"
          opacity="1" filter="url(#ringGlow)"/>

  <!-- Inner thin accent ring -->
  <circle cx="400" cy="400" r="226"
          fill="none" stroke="url(#ringGrad2)"
          stroke-width="2.5" stroke-linecap="round"
          opacity="0.65" filter="url(#softGlow)"/>

  <!-- ============================================================
       ORBITING DOTS — same 6 s clockwise spin as the dash arcs.
       Primary dot is at the leading edge of dash group A so they
       appear inseparably linked.
       ============================================================ -->

  <!-- Primary bright dot (top of ring = 400, 400-235 = 165) -->
  <g id="orbitDot1">
    <circle cx="400" cy="157" r="7" fill="#DDEEFF" opacity="1" filter="url(#dotGlow)"/>
    <circle cx="400" cy="157" r="4" fill="white"   opacity="1"/>
    <animateTransform attributeName="transform"
      type="rotate"
      from="0 400 400"
      to="360 400 400"
      dur="6s"
      begin="-1.5s"
      repeatCount="indefinite"/>
  </g>

  <!-- Secondary dot — 120° ahead (same phase as dashGroupB) -->
  <g id="orbitDot2">
    <circle cx="400" cy="157" r="5" fill="#CC88FF" opacity="0.85" filter="url(#dotGlow)"/>
    <circle cx="400" cy="157" r="2.5" fill="white" opacity="0.9"/>
    <animateTransform attributeName="transform"
      type="rotate"
      from="120 400 400"
      to="480 400 400"
      dur="6s"
      begin="-1.5s"
      repeatCount="indefinite"/>
  </g>

  <!-- Tertiary dot — 240° ahead (same phase as dashGroupC) -->
  <g id="orbitDot3">
    <circle cx="400" cy="157" r="4" fill="#88CCFF" opacity="0.70" filter="url(#dotGlow)"/>
    <circle cx="400" cy="157" r="2" fill="white"   opacity="0.85"/>
    <animateTransform attributeName="transform"
      type="rotate"
      from="240 400 400"
      to="600 400 400"
      dur="6s"
      begin="-1.5s"
      repeatCount="indefinite"/>
  </g>

</svg>
